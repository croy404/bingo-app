name: CI

on:
  push:
    branches: [main, coolify-migration]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm test
      - run: npm run build
        env:
          # Build doesn't connect to DB, but Prisma needs the var present
          DATABASE_URL: postgres://user:pass@localhost:5432/db
          REDIS_URL: redis://localhost:6379
